<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELLMA · Enter workspace</title><style>body{margin:0;background:#f4f7fb;color:#20334b;font:17px system-ui;min-height:100vh;display:grid;place-items:center}form{box-sizing:border-box;width:min(420px,92vw);padding:36px;background:white;border:1px solid #dce4ee;border-radius:16px}h1{font-size:26px;margin-top:0}label{display:grid;gap:12px}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #bccbda}button{width:100%;margin-top:20px;background:#235ed0;color:white;cursor:pointer}p{font-size:14px;color:#526175}#error{color:#a32020}</style></head><body><form><h1>ELLMA Evaluation Studio</h1><p>Enter your username to open the workspace.</p><label>Username<input name="username" autocomplete="username" required autofocus></label><button>Enter workspace</button><p id="error" role="alert"></p></form><script>document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json','X-ELLMA-Client':'1'},body:JSON.stringify({username:e.target.username.value.trim()})});if(!r.ok)throw Error('Username not recognized.');location.reload();}catch(error){document.querySelector('#error').textContent=error.message;button.disabled=false;}});</script></body></html>
